[versions]
agp = "8.7.3"
kotlin = "2.0.21"
compose-compiler = "1.5.8"
compose-wear = "1.4.0"
wear = "1.3.0"
activity-compose = "1.9.3"
core-splashscreen = "1.0.1"
lifecycle = "2.8.7"

[libraries]
wear = { group = "androidx.wear", name = "wear", version.ref = "wear" }
wear-tooling-preview = { group = "androidx.wear", name = "wear-tooling-preview", version.ref = "wear" }
compose-material = { group = "androidx.wear.compose", name = "compose-material", version.ref = "compose-wear" }
compose-foundation = { group = "androidx.wear.compose", name = "compose-foundation", version.ref = "compose-wear" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "core-splashscreen" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }